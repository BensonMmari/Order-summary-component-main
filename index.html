<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="styles.css" rel="stylesheet">
  <title>Order summary card</title>

</head>
<body>
  <main class="card">
    <div class="card-img">
      <img src="illustration-hero.svg" id="illustration-hero"/>
    </div>
    <div class="card-info">
      <h1>Order Summary</h1>
      <p class="description">You can now listen to millions of songs, audiobooks, and podcasts on any
         device anywhere you like!</p>
    </div>
    <div class="plan-container">
      <div class="plan-details">
        <img src="icon-music.svg" id="music-icon"/>
        <div class="plan-text">
          <span>Annual Plan</span></br>
          <span class="plan-price">$59.99/year</span>
        </div>
        <a href="#" id="change">Change</a>
      </div>
      <div class="action-buttons">
        <button type="button" class="primary-button">Proceed to Payment</button>
        <button type="button" class="secondary-button">Cancel Order</button>
      </div>
    </div>
  </main>
  <footer class="attribution">
  </footer>
</body>
</html>
